  <rect x="150" y="235" width="46" height="58" fill="#7FB3D5"/><rect x="284" y="235" width="46" height="58" fill="#7FB3D5"/><rect x="216" y="258" width="48" height="72" fill="#7A4B2E"/>
  <!-- battery + inverter -->
  <rect x="384" y="262" width="52" height="68" rx="8" fill="#2A6BB5"/><rect x="394" y="272" width="32" height="8" rx="2" fill="#BFE0FF"/><rect x="394" y="286" width="32" height="8" rx="2" fill="#BFE0FF" opacity=".7"/><rect x="394" y="300" width="32" height="8" rx="2" fill="#BFE0FF" opacity=".5"/>
  <rect x="444" y="272" width="40" height="58" rx="6" fill="#173F73"/><circle cx="464" cy="294" r="7" fill="#7CD992"/>
  <path d="M374 300 H384 M436 300 H444" stroke="#173F73" stroke-width="4"/>
