  <polygon points="90,195 240,95 390,195" fill="#B8663A"/>
  <polygon points="150,180 240,118 330,180 316,188 240,138 164,188" fill="#8A4727" opacity=".35"/>
  <g fill="url(#pn)" stroke="#A9C8EA" stroke-width="2">
