    <rect x="12" y="18" width="54" height="8" rx="4" fill="#2A6BB5"/>
    <circle cx="39" cy="58" r="20" fill="none" stroke="#DDE9F6" stroke-width="8"/><path d="M39 38 A20 20 0 1 1 20 64" fill="none" stroke="#F5A524" stroke-width="8" stroke-linecap="round"/>
    <rect x="14" y="92" width="50" height="6" rx="3" fill="#BFD4EA"/><rect x="14" y="104" width="34" height="6" rx="3" fill="#BFD4EA"/>
