    <linearGradient id="pn" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3F78B5"/><stop offset="1" stop-color="#17305A"/></linearGradient>
    <linearGradient id="sn" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFC247"/><stop offset="1" stop-color="#F08A1C"/></linearGradient>
  </defs>
  <rect width="520" height="380" rx="24" fill="url(#sky)"/>
  <circle cx="430" cy="70" r="36" fill="url(#sn)"/>
  <g stroke="#F5A524" stroke-width="5" stroke-linecap="round"><line x1="430" y1="16" x2="430" y2="26"/><line x1="484" y1="70" x2="474" y2="70"/><line x1="468" y1="32" x2="461" y2="39"/><line x1="392" y1="32" x2="399" y2="39"/></g>
  <path d="M0 300 L90 230 L170 280 L260 210 L360 285 L440 245 L520 290 L520 380 L0 380Z" fill="#9CC3DC"/>
  <rect x="0" y="320" width="520" height="60" fill="#8DBF7A"/>
